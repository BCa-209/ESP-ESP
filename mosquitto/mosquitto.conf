# Configuración de Mosquitto para laboratorio local (red aislada)
# ================================================================
# IMPORTANTE: Esta configuración permite conexiones anónimas y sin cifrado,
# diseñada EXCLUSIVAMENTE para pruebas en red local (LAN / Laptop Hotspot).
# NO exponer este puerto directamente a Internet sin TLS y autenticación.

# Puerto y dirección de escucha (0.0.0.0 permite conexiones desde cualquier interfaz de red)
listener 1883 0.0.0.0

# Permitir clientes anónimos durante pruebas locales
allow_anonymous true

# Desactivar la persistencia en disco (los estados retenidos se mantienen solo en RAM)
# Cumple con el requisito de no almacenar estados permanentemente en base de datos ni disco.
persistence false

# Nivel de registro (opcional para depuración en consola)
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
log_timestamp true
