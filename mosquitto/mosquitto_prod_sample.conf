# Plantilla de Configuración de Mosquitto para Producción / Host en Internet
# =========================================================================
# Requiere certificados TLS y archivo de contraseñas.

# Puerto seguro con TLS (8883)
listener 8883 0.0.0.0

# Desactivar acceso anónimo
allow_anonymous false

# Ruta al archivo de contraseñas (generado con: mosquitto_passwd -c passwordfile esp32_user)
password_file /etc/mosquitto/passwd

# Certificados TLS
cafile /etc/letsencrypt/live/tu-dominio.com/chain.pem
certfile /etc/letsencrypt/live/tu-dominio.com/cert.pem
keyfile /etc/letsencrypt/live/tu-dominio.com/privkey.pem

# TLS versión mínima recomendada
tls_version tlsv1.2

# Desactivar persistencia en disco si se desea mantener todo en memoria
persistence false

# Control de accesos (ACLs) opcional
# acl_file /etc/mosquitto/acls.conf
